<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playing</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", Arial, sans-serif; }
      .video-wrap { position: fixed; inset: 0; background: #000; }
      #player { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
      iframe { width: 100%; height: 100%; }
      .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 40px; background: transparent; z-index: 100; pointer-events: none; }
      .panel { pointer-events: auto; width: auto; max-width: 90vw; background: rgba(15,22,32,.85); border: 1px solid rgba(34,48,67,.9); border-radius: 14px; padding: 20px 30px; box-shadow: 0 18px 60px rgba(0,0,0,.55); text-align: center; }
      .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #b7c4d6; margin-bottom: 10px; }
      .pill { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); padding: 3px 10px; border-radius: 999px; }
      .q { font-size: 20px; font-weight: 700; margin: 4px 0 16px; }
      .choices { display: flex; gap: 20px; justify-content: center; }
      .btn { width: auto; min-width: 200px; text-align: center; padding: 14px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.07); color: #fff; font-size: 16px; cursor: pointer; transition: all 0.2s; }
      .btn:hover { background: rgba(45,125,255,.20); border-color: rgba(45,125,255,.45); }
      .gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(0,0,0,.70); }
      .gpanel { width: min(560px, 92vw); background: rgba(15,22,32,.95); border: 1px solid rgba(34,48,67,.9); border-radius: 14px; padding: 18px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
      .gtitle { font-size: 18px; font-weight: 750; margin: 0 0 8px; }
      .ghint { font-size: 13px; color: #b7c4d6; line-height: 1.6; margin: 0 0 14px; }
      .gbtn { width: 100%; padding: 12px; border-radius: 10px; border: 0; background: #2d7dff; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
      .gbtn:hover { background: #256cf0; }
      form { margin: 0; }
    </style>
  </head>
  <body>
    <div class="video-wrap">
      <div id="player"></div>
    </div>

    <div id="audioGate" class="gate">
      <div class="gpanel">
        <div class="gtitle">Tap to enable audio</div>
        <p class="ghint">Your browser may block autoplay with sound. If audio does not start automatically, tap the button below to start playback with sound.</p>
        <button id="audioBtn" class="gbtn" type="button">Start with sound</button>
      </div>
    </div>

    <div id="choiceOverlay" class="overlay">
      <div class="panel">
        <div class="q">{{ question }}</div>
        <div class="choices">
          <form method="post" action="/choice">
            <input type="hidden" name="choice" value="A" />
            <button id="btnA" class="btn" type="submit">{{ a_label }}</button>
          </form>
          <form method="post" action="/choice">
            <input type="hidden" name="choice" value="B" />
            <button id="btnB" class="btn" type="submit">{{ b_label }}</button>
          </form>
        </div>
      </div>
    </div>

    <form id="nextForm" method="post" action="/next" style="display:none"></form>

    <script>
      const choiceOverlay = document.getElementById('choiceOverlay');
      const nextForm = document.getElementById('nextForm');
      const audioGate = document.getElementById('audioGate');
      const audioBtn = document.getElementById('audioBtn');
      const HAS_CHOICE = {{ 'true' if has_choice else 'false' }};
      const YOUTUBE_ID = "{{ youtube_id }}";

      // Disable right-click menu
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      // Try to block pause-related keyboard shortcuts (Space/K/P)
      document.addEventListener('keydown', (e) => {
        const k = (e.key || '').toLowerCase();
        if (k === ' ' || k === 'k' || k === 'p') e.preventDefault();
      }, { capture: true });

      // YouTube IFrame API: try autoplay with sound + end-state listener
      // Notes:
      // - Many browsers block autoplay with sound unless the user interacts.
      // - Auto-enter fullscreen generally requires a user gesture.
      const AUDIO_SS_KEY = 'ytExpAudioUnlocked';

      function isAudioUnlocked() {
        try {
          return sessionStorage.getItem(AUDIO_SS_KEY) === '1';
        } catch (_) {
          return false;
        }
      }
      function markAudioUnlocked() {
        try {
          sessionStorage.setItem(AUDIO_SS_KEY, '1');
        } catch (_) {}
      }

      let player = null;
      let ready = false;
      let started = false;
      let endPollId = null;
      let choiceFrozen = false;

      function showAudioGate() {
        if (isAudioUnlocked()) return;
        audioGate.style.display = 'flex';
      }
      function hideAudioGate() {
        audioGate.style.display = 'none';
      }
      function attemptPlayWithSound() {
        if (!player) return;
        try { player.unMute(); } catch (_) {}
        try { player.setVolume(100); } catch (_) {}
        try { player.playVideo(); } catch (_) {}
      }

      audioBtn.addEventListener('click', () => {
        markAudioUnlocked();
        hideAudioGate();
        attemptPlayWithSound();
      });

      function clearEndPoll() {
        if (endPollId != null) {
          clearInterval(endPollId);
          endPollId = null;
        }
      }

      function freezeNearEndAndShowChoices() {
        if (!player || choiceFrozen) return;
        choiceFrozen = true;
        clearEndPoll();
        let d = 0;
        try {
          d = player.getDuration();
        } catch (_) {}
        if (!d || !isFinite(d)) d = 0;
        try {
          player.pauseVideo();
        } catch (_) {}
        try {
          player.seekTo(Math.max(0, d - 0.05), true);
        } catch (_) {}
        setTimeout(() => {
          try {
            player.pauseVideo();
          } catch (_) {}
          choiceOverlay.style.display = 'flex';
        }, 120);
      }

      function startChoiceEndPoll() {
        if (!HAS_CHOICE) return;
        clearEndPoll();
        endPollId = setInterval(() => {
          if (!player || choiceFrozen) return;
          let d = 0;
          let t = 0;
          try {
            d = player.getDuration();
            t = player.getCurrentTime();
          } catch (_) {
            return;
          }
          if (!d || !isFinite(d) || d <= 0) return;
          if (t >= d - 0.25) {
            freezeNearEndAndShowChoices();
          }
        }, 150);
      }

      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          videoId: YOUTUBE_ID,
          playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 1,
            rel: 0,
            modestbranding: 1,
            playsinline: 1,
            iv_load_policy: 3
          },
          events: {
            onReady: (event) => {
              ready = true;
              choiceFrozen = false;
              // Try to start with sound; if blocked, show gate (once per browser session).
              try { event.target.unMute(); } catch (_) {}
              try { event.target.setVolume(100); } catch (_) {}
              try { event.target.playVideo(); } catch (_) {}

              if (HAS_CHOICE) {
                startChoiceEndPoll();
              }

              if (!isAudioUnlocked()) {
                setTimeout(() => {
                  if (!started) showAudioGate();
                }, 700);
              }
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PLAYING) {
                started = true;
                markAudioUnlocked();
                hideAudioGate();
              }
              if (event.data === YT.PlayerState.ENDED) {
                if (HAS_CHOICE) {
                  if (!choiceFrozen) {
                    freezeNearEndAndShowChoices();
                  }
                } else {
                  clearEndPoll();
                  nextForm.submit();
                }
              }
            }
          }
        });
      }

      // Dynamically load the API to avoid blocking
      (function loadYT() {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
      })();
    </script>
  </body>
</html>
