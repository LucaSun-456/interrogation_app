<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Experiment</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0f14; color: #e8eef6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", Arial, sans-serif; }
      .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card { width: min(520px, 92vw); background: #0f1620; border: 1px solid #223043; border-radius: 14px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
      h1 { font-size: 18px; margin: 0 0 10px; font-weight: 650; }
      .hint { font-size: 13px; color: #b7c4d6; line-height: 1.5; margin: 0 0 14px; }
      label { display: block; font-size: 13px; color: #b7c4d6; margin: 0 0 6px; }
      input { width: 100%; padding: 12px 12px; border-radius: 10px; border: 1px solid #2a3a52; background: #0b111a; color: #e8eef6; font-size: 16px; outline: none; }
      input:focus { border-color: #5aa2ff; box-shadow: 0 0 0 3px rgba(90,162,255,.18); }
      .row { display: grid; gap: 10px; margin-top: 12px; }
      button { width: 100%; padding: 12px; border-radius: 10px; border: 0; background: #2d7dff; color: #fff; font-weight: 650; font-size: 15px; cursor: pointer; }
      button:hover { background: #256cf0; }
      .err { margin-top: 10px; color: #ff7a7a; font-size: 13px; }
      .footer { margin-top: 12px; font-size: 12px; color: #8fa3bd; }
      code { background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Video Playback Task</h1>
        <p class="hint">Enter a participant ID to begin (e.g., 1-1 or 2-Guilty).</p>
        <form method="post" action="/start">
          <label for="pid">Participant ID</label>
          <input id="pid" name="participant_id" autocomplete="off" placeholder="1-1" autofocus required />
          <div class="row">
            <button type="submit">Start</button>
          </div>
        </form>
        {% if error %}
          <div class="err">{{ error }}</div>
        {% endif %}
        <div class="footer">Note: browsers usually require a user gesture for fullscreen. Playback itself is configured for automatic progression between videos.</div>
      </div>
    </div>
  </body>
</html>
