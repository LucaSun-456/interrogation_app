# Reverse proxy only — no rate limiting (experiment traffic is bursty).

server {
    listen 80;
    server_name spe-avatar.com www.spe-avatar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serious-game MP4s: serve from host mount (see docker-compose nginx volume if used)
    location /static/videos/ {
        alias /var/www/interrogation-static/videos/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        add_header Accept-Ranges bytes;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
