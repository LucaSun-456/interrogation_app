services:
  app:
    build: .
    container_name: interrogation-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./materials:/app/materials:ro
      - ./static/videos/serious-game:/app/static/videos/serious-game:ro
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - GUNICORN_LOG_LEVEL=info
      - LOG_DIR=/app/logs
      - DATA_DIR=/app/data
      - EXCEL_FILE=/app/data/experiment_data.xlsx
      - GUNICORN_WORKERS=1
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32M
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: "1.5"
        reservations:
          memory: 384M
          cpus: "0.5"

  nginx:
    image: nginx:1.25-alpine
    container_name: interrogation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./nginx/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.3"

  certbot:
    image: certbot/certbot:latest
    container_name: interrogation-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt:rw
      - ./nginx/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done'"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
